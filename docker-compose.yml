# The bot runs next to ytdlp2STRM (https://github.com/fe80Grau/ytdlp2STRM).
# Both containers mount the same media folder and the same channel_list.json.

services:
  bot:
    build:
      context: .
      args:
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    image: jelly-yt-bot:latest
    env_file: .env
    restart: unless-stopped
    volumes:
      - ${MEDIA_HOST:-/srv/media}:/media
      # Same file ytdlp2STRM mounts as plugins/youtube/channel_list.json
      - ${CHANNEL_LIST_HOST:-./ytdlp2strm/channel_list.json}:/config/channel_list.json
      # Optional: YouTube cookies (Netscape format) for private/age-restricted items
      # - ./cookies.txt:/config/cookies.txt:ro

  # Example ytdlp2STRM service (skip if you already run it elsewhere).
  ytdlp2strm:
    image: fe80grau/ytdlp2strm
    environment:
      - AM_I_IN_A_DOCKER_CONTAINER=Yes
      - DOCKER_PORT=5005
    volumes:
      - ${MEDIA_HOST:-/srv/media}:/media
      - ${CHANNEL_LIST_HOST:-./ytdlp2strm/channel_list.json}:/opt/ytdlp2STRM/plugins/youtube/channel_list.json
      - ytdlp2strm-data:/opt/ytdlp2STRM
    ports:
      - "5005:5000"
    restart: unless-stopped

volumes:
  ytdlp2strm-data:
