# Three small services sharing one image and one media volume.
# Jellyfin itself is expected to run separately (or add it below) with the
# same host directory mounted read-only as a "Shows" library.

x-jelly-yt: &jelly-yt
  build:
    context: .
    args:
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
  image: jelly-yt:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - ${MEDIA_ROOT_HOST:-/srv/media/youtube}:/srv/media/youtube

services:
  proxy:
    <<: *jelly-yt
    command: ["python", "-m", "jelly_yt.proxy"]
    ports:
      - "${PROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  worker:
    <<: *jelly-yt
    command: ["python", "-m", "jelly_yt.ingest_worker", "run"]

  bot:
    <<: *jelly-yt
    command: ["python", "-m", "jelly_yt.bot"]

