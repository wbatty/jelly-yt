[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jelly-yt"
version = "1.0.0"
description = "Telegram bot that adds YouTube playlists, single videos and channels to Jellyfin via ytdlp2STRM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "httpx>=0.27,<1",
    "python-telegram-bot>=21,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jelly-yt-bot = "jelly_yt.bot:main"

[tool.setuptools.packages.find]
include = ["jelly_yt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
